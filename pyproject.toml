[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-gpu-orchestrator"
version = "1.6.0a0"
description = "Adaptive GPU Orchestrator for AI Workloads: interpretable performance modeling, experiment recommendation, campaign baselines, reproducible research export, telemetry, and optimization."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Adaptive GPU Orchestrator contributors"}]
keywords = ["gpu", "cuda", "llm", "distributed-systems", "hpc", "orchestration", "nccl", "nvidia"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Distributed Computing",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
nvml = ["nvidia-ml-py>=12"]

[project.scripts]
agoctl = "adaptive_gpu_orchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["adaptive_gpu_orchestrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
check_untyped_defs = true
